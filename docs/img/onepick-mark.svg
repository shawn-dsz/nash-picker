<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OnePick">
  <title>OnePick</title>
  <!--
    Three become one.

    Three muted bars are the three devices a picker carries today, one per
    channel. They converge into a single acid-green one: the queue. Strokes are
    deliberately heavy - the mark has to survive a 16px favicon.
  -->
  <rect width="96" height="96" rx="22" fill="#01051E"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#ffffff1f" stroke-width="1.5"/>

  <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- the three channels -->
    <path d="M20 28 H34"/>
    <path d="M20 48 H34"/>
    <path d="M20 68 H34"/>
    <!-- converging into one spine -->
    <path d="M34 28 H44 Q50 28 50 34 V48"/>
    <path d="M34 68 H44 Q50 68 50 62 V48"/>
    <path d="M34 48 H52"/>
  </g>

  <!-- the one queue -->
  <rect x="52" y="41" width="26" height="14" rx="7" fill="#c9ff00"/>
</svg>
