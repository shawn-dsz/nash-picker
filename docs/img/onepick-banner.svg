<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="OnePick - three devices become one queue">
  <title>OnePick - three devices become one queue</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ff00" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#c9ff00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#01051E"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="317" width="1200" height="3" fill="#c9ff00"/>

  <!-- mark -->
  <g transform="translate(72 112)">
    <rect width="96" height="96" rx="22" fill="#0a0f28"/>
    <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#ffffff26" stroke-width="1.5"/>
    <g fill="#ffffff" fill-opacity="0.34">
      <rect x="22" y="27" width="19" height="7" rx="3.5"/>
      <rect x="22" y="44.5" width="19" height="7" rx="3.5"/>
      <rect x="22" y="62" width="19" height="7" rx="3.5"/>
    </g>
    <path d="M43 30.5 H52 Q57 30.5 57 37 V48" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M43 48 H57" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M43 65.5 H52 Q57 65.5 57 59 V48" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="57" y="43" width="19" height="10" rx="5" fill="#c9ff00"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="163"
        font-family="Host Grotesk, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="700" letter-spacing="-3">
    <tspan fill="#ffffff">One</tspan><tspan fill="#c9ff00">Pick</tspan>
  </text>

  <text x="215" y="207"
        font-family="Host Grotesk, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="400" fill="#ffffffb3" letter-spacing="-0.2">
    Three devices become one queue.
  </text>

  <text x="215" y="240"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="400" fill="#ffffff70" letter-spacing="0.6">
    A lightweight web picking app on Nash&#8217;s pick_and_pack model
  </text>
</svg>
